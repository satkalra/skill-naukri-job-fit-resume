name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install python-docx reportlab pypdf pdfplumber
      - run: for f in .claude-plugin/*.json; do python -m json.tool "$f" >/dev/null; done
      - run: '[ ! -d tests ] || python -m unittest discover -s tests'
      - run: python naukri/scripts/build_resume.py naukri/examples/jordan_lee.json --out-dir out --pdf
      - run: python naukri/scripts/parse_check.py out/*.pdf --source naukri/examples/jordan_lee.json
